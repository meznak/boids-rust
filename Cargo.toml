[package]
name = "boids-rust"
version = "1.0.1"
edition = "2024"
description = "A Boids flocking simulation"
license = "MIT"
repository = "https://github.com/meznak/boids-rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.18.1"
bytes = "1.11.1"
rand = "0.10.1"

[dev-dependencies]
bytes = "1.11.1"

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
