[package]
name = "boids-rust"
version = "0.1.0"
edition = "2024"
description = "A Boids flocking simulation"
license = "MIT"
repository = "https://github.com/meznak/boids-rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.18.1" }
rand = "0.10.1"

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true